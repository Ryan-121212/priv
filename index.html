<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ultimate Hub</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(
135deg,
#0f172a,
#1e293b,
#0f172a
);
display:flex;
justify-content:center;
align-items:center;
padding:25px;
color:white;
overflow-x:hidden;
}

.container{
width:100%;
max-width:1400px;
}

.dashboard{
backdrop-filter:blur(18px);
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.1);
border-radius:25px;
padding:30px;
box-shadow:0 0 40px rgba(0,0,0,0.4);
}

.header{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
gap:20px;
margin-bottom:30px;
}

.title{
font-size:2rem;
font-weight:bold;
}

.time-box{
text-align:right;
}

.clock{
font-size:2rem;
font-weight:bold;
color:#38bdf8;
}

.date{
opacity:.8;
}

.search{
margin-bottom:35px;
display:flex;
gap:10px;
}

.search input{
flex:1;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
}

.search button{
padding:15px 25px;
border:none;
cursor:pointer;
border-radius:12px;
background:#0ea5e9;
color:white;
font-weight:bold;
}

.section{
margin-top:25px;
}

.section h2{
margin-bottom:15px;
color:#38bdf8;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.card{
text-decoration:none;
color:white;
background:rgba(255,255,255,.08);
padding:20px;
border-radius:15px;
text-align:center;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
background:rgba(255,255,255,.15);
}

.icon{
font-size:32px;
margin-bottom:10px;
}

footer{
text-align:center;
margin-top:30px;
opacity:.6;
font-size:.9rem;
}

</style>
</head>

<body>

<div class="container">

<div class="dashboard">

<div class="header">

<div class="title">
🚀 Ultimate Entertainment Hub
</div>

<div class="time-box">
<div class="clock" id="clock"></div>
<div class="date" id="date"></div>
</div>

</div>

<form class="search"
action="https://www.google.com/search"
target="_blank">

<input
type="text"
name="q"
placeholder="Search Google...">

<button type="submit">
Search
</button>

</form>

<div class="section">

<h2>🎬 Streaming</h2>

<div class="grid">

<a class="card" href="https://youtube.com" target="_blank">
<div class="icon">▶️</div>
YouTube
</a>

<a class="card" href="https://netflix.com" target="_blank">
<div class="icon">🎥</div>
Netflix
</a>

<a class="card" href="https://spotify.com" target="_blank">
<div class="icon">🎵</div>
Spotify
</a>

<a class="card" href="https://disneyplus.com" target="_blank">
<div class="icon">⭐</div>
Disney+
</a>

<a class="card" href="https://twitch.tv" target="_blank">
<div class="icon">🎮</div>
Twitch
</a>

</div>
</div>

<div class="section">

<h2>🎮 Gaming Sites</h2>

<div class="grid">

<a class="card" href="https://poki.com" target="_blank">
<div class="icon">🕹️</div>
Poki
</a>

<a class="card" href="https://crazygames.com" target="_blank">
<div class="icon">🔥</div>
CrazyGames
</a>

<a class="card" href="https://coolmathgames.com" target="_blank">
<div class="icon">📚</div>
Coolmath Games
</a>

<a class="card" href="https://kongregate.com" target="_blank">
<div class="icon">⚔️</div>
Kongregate
</a>

<a class="card" href="https://www.xbox.com/play" target="_blank">
<div class="icon">☁️</div>
Xbox Cloud
</a>

</div>
</div>

<div class="section">

<h2>⚡ Quick Links</h2>

<div class="grid">

<a class="card" href="https://github.com" target="_blank">
<div class="icon">💻</div>
GitHub
</a>

<a class="card" href="https://discord.com" target="_blank">
<div class="icon">💬</div>
Discord
</a>

<a class="card" href="https://reddit.com" target="_blank">
<div class="icon">👽</div>
Reddit
</a>

<a class="card" href="https://gmail.com" target="_blank">
<div class="icon">📧</div>
Gmail
</a>

<a class="card" href="https://x.com" target="_blank">
<div class="icon">🌐</div>
X
</a>

</div>
</div>

<footer>
Built with HTML • CSS • JavaScript
</footer>

</div>
</div>

<script>

function updateClock(){

const now = new Date();

document.getElementById("clock").innerHTML =
now.toLocaleTimeString();

document.getElementById("date").innerHTML =
now.toLocaleDateString(undefined,{
weekday:'long',
year:'numeric',
month:'long',
day:'numeric'
});

}

setInterval(updateClock,1000);
updateClock();

</script>

</body>
</html>
